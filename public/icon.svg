<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B3F" />
      <stop offset="50%" stop-color="#A3792C" />
      <stop offset="100%" stop-color="#84601F" />
    </linearGradient>
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2DDD5" />
    </linearGradient>
  </defs>

  <!-- Background for standalone icon -->
  <rect width="500" height="500" rx="40" fill="#111111" />

  <g transform="translate(45, 40) scale(0.82)">
    <!-- Film strip sprigs / branch curling top left -->
    <g stroke="#C59B3F" stroke-width="2.5" fill="none">
      <!-- Curved film strip 1 -->
      <path d="M 120 180 Q 90 145 60 145 Q 85 130 140 160" stroke="#FAF8F5" stroke-width="8" stroke-linecap="round" fill="none"/>
      <!-- Sprocket holes -->
      <line x1="75" y1="144" x2="75" y2="149" stroke="#111111" stroke-width="4"/>
      <line x1="95" y1="147" x2="95" y2="152" stroke="#111111" stroke-width="4"/>
      <line x1="115" y1="156" x2="115" y2="161" stroke="#111111" stroke-width="4"/>

      <!-- Curved film strip 2 (higher) -->
      <path d="M 135 170 Q 110 100 80 110 Q 115 90 150 145" stroke="#FAF8F5" stroke-width="8" stroke-linecap="round" fill="none"/>
      <line x1="90" y1="108" x2="90" y2="114" stroke="#111111" stroke-width="4"/>
      <line x1="108" y1="105" x2="108" y2="111" stroke="#111111" stroke-width="4"/>
      <line x1="126" y1="117" x2="126" y2="123" stroke="#111111" stroke-width="4"/>

      <!-- Curved film strip 3 (upright) -->
      <path d="M 150 160 Q 140 70 125 60 Q 150 65 160 135" stroke="#FAF8F5" stroke-width="8" stroke-linecap="round" fill="none"/>
      <line x1="130" y1="67" x2="135" y2="67" stroke="#111111" stroke-width="4"/>
      <line x1="133" y1="85" x2="138" y2="85" stroke="#111111" stroke-width="4"/>
      <line x1="137" y1="105" x2="142" y2="105" stroke="#111111" stroke-width="4"/>
    </g>

    <!-- Main Architectural Arabic Calligraphy - Al Mamoura -->
    <!-- Left structure (Ta Marbuta / Waw / Ra) -->
    <g fill="#FAF8F5">
      <!-- Dot / crown block on far left -->
      <rect x="10" y="185" width="42" height="10" rx="2" />

      <!-- Left box body -->
      <path d="M 0 200 H 50 V 340 H 0 Z M 16 230 H 34 V 315 H 16 Z" />

      <!-- Curved loop connector -->
      <path d="M 60 200 H 155 V 375 H 98 V 345 H 125 V 230 H 90 V 375 H 60 Z" />
      
      <!-- Central base connection -->
      <path d="M 170 185 H 230 V 325 H 170 Z M 188 215 H 212 V 295 H 188 Z" />
    </g>

    <!-- THE SIGNATURE GOLDEN PILLAR (Middle letter Mim) -->
    <g fill="url(#goldGrad)">
      <path d="M 233 80 H 298 V 225 H 233 Z M 249 110 H 282 V 195 H 249 Z" />
    </g>

    <!-- Right Arabic Calligraphy structure (Alef / Lam) -->
    <g fill="#FAF8F5">
      <!-- Middle Arch -->
      <path d="M 302 80 H 368 V 225 H 302 Z M 318 110 H 352 V 195 H 318 Z" />

      <!-- Right Alefs (Vertical Pillars) -->
      <rect x="375" y="65" width="34" height="160" rx="2" />
      <rect x="418" y="65" width="30" height="160" rx="2" />
    </g>

    <!-- Bottom English Typography: AL MAMOURA FILM FESTIVAL -->
    <g fill="#FAF8F5" font-family="'Plus Jakarta Sans', sans-serif">
      <text x="180" y="270" font-size="28" font-weight="800" letter-spacing="9">AL MAMOURA</text>
      <text x="180" y="315" font-size="28" font-weight="800" letter-spacing="18.5">FILM</text>
      <text x="180" y="360" font-size="28" font-weight="800" letter-spacing="9.8">FESTIVAL</text>
    </g>
  </g>
</svg>
